  :root { color-scheme: dark; }

  .glow { position: absolute; left: 50%; bottom: 56px; width: 460px; height: 120px; transform: translateX(-50%);

    background: radial-gradient(circle at 34% 30%, #b8fff6, #5ad1c8 45%, #1f7f79 100%);

  .label { position: absolute; left: 20px; top: 18px; font-size: 12px; letter-spacing: .18em;
    color: #5f8ab8; text-transform: uppercase; }
  .hint { position: absolute; right: 20px; bottom: 18px; font-size: 12px; color: #46658a; }
  .gate { position: absolute; inset: 0; display: grid; place-items: center; cursor: pointer;
    background: rgba(6,10,16,.52); backdrop-filter: blur(2px); }
  .gate[hidden] { display: none; }
  .gate span { font-size: 15px; letter-spacing: .08em; color: #d7f6f2; padding: 12px 22px;
    border: 1px solid rgba(90,209,200,.5); border-radius: 999px; background: rgba(11,17,25,.7); }
</style>

<script>
// 音频运行时。
// 三条硬规则：
//  1. base64 自己解，不用 fetch(data:)——file:// 下某些浏览器会拦。
//  2. resume() 必须在用户手势里同步调用；否则上下文被按在 suspended。
//  3. 每次播放前先停掉上一轮的所有节点。loop:true 的底噪不会自己结束，
//     不显式 stop 就会一层层叠上去，越放越响。
const SOUND = (() => {
  const data = JSON.parse(document.getElementById('dsh-audio').textContent)
  const ctx = new (window.AudioContext || window.webkitAudioContext)()
  const master = ctx.createDynamicsCompressor()
  master.threshold.value = -6
  master.knee.value = 6
  master.ratio.value = 12
  master.attack.value = 0.003
  master.release.value = 0.25
  master.connect(ctx.destination)

  let buffers = null
  let t0 = 0
  let started = false
  let bus = null
  const active = new Set()

  function toArrayBuffer (dataUri) {
    const binary = atob(dataUri.slice(dataUri.indexOf(',') + 1))
    const bytes = new Uint8Array(binary.length)
    for (let i = 0; i < binary.length; i += 1) bytes[i] = binary.charCodeAt(i)
    return bytes.buffer
  }

  function decodeAll () {
    return Promise.all(data.cues.map((cue) => ctx.decodeAudioData(toArrayBuffer(cue.src))))
  }

  function stop () {
    for (const node of active) {
      try { node.stop() } catch { /* already stopped */ }
      try { node.disconnect() } catch { /* already detached */ }
    }
    active.clear()
    if (bus !== null) {
      try { bus.disconnect() } catch { /* already detached */ }
      bus = null
    }
    started = false
  }

  async function start () {
    stop()                              // 关键：上一轮的循环底噪必须先掐掉
    const resuming = ctx.resume()       // 同步调用，保住"用户已交互"的资格
    if (!buffers) buffers = await decodeAll()
    await resuming
    if (ctx.state !== 'running') throw new Error(`audio context is ${ctx.state}`)
    bus = ctx.createGain()
    bus.connect(master)
    t0 = ctx.currentTime + 0.06
    data.cues.forEach((cue, index) => {
      const gain = ctx.createGain()
      gain.gain.value = cue.gain ?? 1
      gain.connect(bus)
      const node = ctx.createBufferSource()
      node.buffer = buffers[index]
      node.loop = cue.loop === true
      node.connect(gain)
      node.start(Math.max(0, t0 + cue.at))
      active.add(node)
    })
    started = true
    return true
  }

  return {
    start,
    stop,
    get started () { return started },
    get unlocked () { return ctx.state === 'running' },
    time: () => (started ? ctx.currentTime - t0 : -1),
    duration: data.duration
  }
})()
</script>

<script>
// 运动学：用解析式而不是缓动，方便把"落地的那一帧"钉在 cue 的时间上。
const IMPACTS = [0.60, 1.28, 1.84, 2.24]
const BOUNCE_HEIGHT = [0.72, 0.42, 0.24, 0.12]
const FALL_FROM = 0.10
const GROUND_Y = 340
const RADIUS = 28
const TOTAL = 3.2
const TAIL = 0.7

const ball = document.getElementById('ball')
const shadow = document.getElementById('shadow')
const gate = document.getElementById('gate')
const gateText = document.getElementById('gateText')
let playing = false
let useFallback = false
let fallbackAt = 0
let endTimer = null

function heightAt (t) {
  if (t < IMPACTS[0]) {
    const u = Math.min(1, Math.max(0, (t - FALL_FROM) / (IMPACTS[0] - FALL_FROM)))
    return 1 - u * u
  }
  for (let i = 0; i < IMPACTS.length - 1; i += 1) {
    if (t < IMPACTS[i + 1]) {
      const u = (t - IMPACTS[i]) / (IMPACTS[i + 1] - IMPACTS[i])
      return 4 * BOUNCE_HEIGHT[i] * u * (1 - u)
    }
  }
  return 0
}

function render (t) {
  const h = heightAt(t)
  const y = (GROUND_Y - RADIUS - 60) * h
  let sx = 1
  let sy = 1
  for (const impact of IMPACTS) {
    const dt = t - impact
    if (dt >= 0 && dt < 0.16) {
      const k = Math.cos((dt / 0.16) * Math.PI * 0.5)
      sx = 1 + 0.28 * k
      sy = 1 - 0.26 * k
    }
  }
  ball.style.transform = `translate3d(0, ${-y}px, 0) scale(${sx.toFixed(3)}, ${sy.toFixed(3)})`
  shadow.style.transform = `scale(${(0.55 + h * 0.75).toFixed(3)})`
  shadow.style.opacity = String(0.22 + h * 0.5)
}

function now () {
  return useFallback ? (performance.now() - fallbackAt) / 1000 : SOUND.time()
}

function frame () {
  if (!playing) return
  const t = now()
  if (t >= 0) render(Math.min(t, TOTAL))
  requestAnimationFrame(frame)
}

function showGate (text, mode) {
  gateText.textContent = text
  gate.dataset.mode = mode ?? ''
  gate.hidden = false
}

// 一轮播完：停掉所有声音（含循环的底噪），把画面停在落地状态，露出重播按钮。
function finish () {
  playing = false
  clearTimeout(endTimer)
  SOUND.stop()
  render(TOTAL)
  showGate('重播', 'replay')
}

async function play () {
  gate.hidden = true
  clearTimeout(endTimer)
  try {
    await SOUND.start()
    useFallback = false
  } catch (error) {
    useFallback = true
    fallbackAt = performance.now()
    showGate('静音播放中 · 点此重试声音', 'retry')
  }
  playing = true
  render(0)
  requestAnimationFrame(frame)
  endTimer = setTimeout(finish, (TOTAL + TAIL) * 1000)
}

gate.addEventListener('click', (event) => {
  event.stopPropagation()
  play()
})

// 切到后台就停声：一个演示页没有理由在看不见的地方继续响。
document.addEventListener('visibilitychange', () => {
  if (document.hidden && playing) finish()
})

render(0)
if (SOUND.unlocked) play()
else showGate('点击开始')
</script>

# dsh-audiokit bundle: registers the sound-for-animation tools, skill and settings page.
#
# Providers are optional: synthesis, mixing and the technical half of
# audio_check work with no key at all. Fill these in to enable speech and the
# semantic half of the check. The settings page edits the same values.
- insert:
    - id: dsh-audio
      name: dsh-audiokit
      config:
        tts:
          # minimax (default) | edge | openai | custom | none
          # edge = Microsoft read-aloud: free, no API key, 300+ voices. The
          # service only returns compressed audio, so the plugin decodes it with
          # a local ffmpeg; leave ffmpegPath empty to auto-detect
          # ~/.dsh/tools/ffmpeg/bin. Without ffmpeg it still writes a playable
          # .mp3 instead of failing.
          provider: minimax
          baseUrl: https://api.minimax.chat
          model: speech-2.8-hd
          voice: female-shaonv
          apiKeyEnv: MINIMAX_API_KEY
          # groupId: ''      # only the legacy T2A endpoint needs this
          # apiKey: ''       # prefer the settings page or the env var
          # ffmpegPath: ''   # edge only; empty means auto-detect
        check:
          # OpenAI-compatible audio-input endpoint. qwen2.5-omni-7b is the small
          # omni model; if your account exposes another id, type it in Settings.
          provider: openai
          baseUrl: https://dashscope.aliyuncs.com/compatible-mode
          model: qwen2.5-omni-7b
          apiKeyEnv: DASHSCOPE_API_KEY
          # autoValidate: false   # experimental: probe the saved model on save
        # voicebankDir: ''        # optional recorded voicebank for audio_sing;
        #                         # empty means ~/.dsh/dsh-audio/voicebank/
